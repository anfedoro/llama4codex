[project]
name = "llama4codex"
version = "0.1.0"
description = "Stateless OpenAI Responses protocol adapter for llama-server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
llama4codex = "llama4codex.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
